# Repo-root Ansible config — used by tooling that runs from the project root,
# notably the local ansible-lint pre-commit hook. Real playbook runs use
# ansible/ansible.cfg (operators run ansible-playbook from the ansible/ dir).
# Both must agree on where roles live: ansible/roles.
[defaults]
roles_path = ansible/roles
collections_path = ansible/collections:~/.ansible/collections
